plugins {
  id 'org.owasp.dependencycheck' version '13.0.0'
  id 'java-library'
  id 'io.gatling.gradle' version '3.15.1.2'
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

tasks.withType(Copy).all{
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
  mavenCentral()
}

gatling {
  gatlingVersion = '3.15.1'
}

tasks.named('gatlingRecorder') {
  // Keep browser recordings separate from curated performance journeys.
  simulationPackage = 'recorded'
  simulationClass = 'RecordedSimulation'
}

tasks.named('gatlingRun') {
  // Keep CI and the default local run focused on the curated load profile.
  simulationClassName = 'simulations.AppRegSimulation'
  systemProperties = ['gatling.data.console.writePeriod':
      System.getProperty('gatling.data.console.writePeriod', '5')]
}

tasks.register('printWorkloadPlan', JavaExec) {
  classpath = sourceSets.gatling.runtimeClasspath
  mainClass = 'utils.WorkloadPlanPrinter'
  systemProperties System.properties
}

tasks.register('workloadSelfCheck', JavaExec) {
  classpath = sourceSets.gatling.runtimeClasspath
  mainClass = 'utils.WorkloadProfile'
}

tasks.register('traceContextSelfCheck', JavaExec) {
  classpath = sourceSets.gatling.runtimeClasspath
  mainClass = 'utils.AppRegTraceContext'
}
