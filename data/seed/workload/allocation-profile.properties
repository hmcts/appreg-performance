# ARCPOC-1633 workload allocation profiles.
#
# These are data requirements, not Gatling injection settings. They are derived from the agreed
# initial benchmark: 500 concurrent users, 75 minutes, one completed action per user per minute,
# global action weights and 20% safety headroom. Counts are rounded up so the requested capacity
# is never under-provisioned.
#
# The smoke profile is used by Jenkins proof validation. The validation profile is the first
# multi-user end-to-end run: ten users for five minutes at one completed action per user per
# minute, with 20% headroom. The initial profile is the 500-user 75-minute benchmark.

smoke.update_application=1
smoke.add_application=1
smoke.result_application=1
smoke.result_multiple=1
smoke.update_result=1
smoke.update_list=1
smoke.close_list=1
smoke.bulk_officials=1
smoke.bulk_fees=1
smoke.bulk_upload=1

# Small end-to-end workload validation (10 concurrent users x 5 minutes x 1 action/minute).
#
# Gatling chooses a branch at runtime, so weighted counts are not a safe allocation boundary for
# a short validation run: a low-weight action can legitimately be selected more often than its
# expected share. Allocate six isolated records for every user/action combination (60 per action)
# so every destructive branch remains safe for the full validation window.
validation.concurrent_users=10
validation.duration_minutes=5
# Ten accounts over one second is within the confirmed safe 10-logins-per-second rate.
validation.login_ramp_up_seconds=1
validation.update_application=60
validation.add_application=60
validation.result_application=60
validation.result_multiple=60
validation.update_result=60
validation.update_list=60
validation.close_list=60
validation.bulk_officials=60
validation.bulk_fees=60
validation.bulk_upload=60

initial.concurrent_users=500
initial.duration_minutes=75
# 500 accounts / 10 safe logins per second.
initial.login_ramp_up_seconds=50
initial.update_application=17577
initial.add_application=8257
initial.result_application=1990
initial.result_multiple=3465
initial.update_result=3255
initial.update_list=2700
initial.close_list=300
initial.bulk_officials=1882
initial.bulk_fees=617
initial.bulk_upload=300

# Create Application List creates runtime-unique data and does not require a prerequisite feeder.
initial.create_application_list_actions=3214
# Search, reporting and other UI operations are non-destructive and use stable synthetic data.
initial.other_operations_actions=1149
