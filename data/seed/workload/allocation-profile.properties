# ARCPOC-1633 workload allocation profiles.
#
# The base action counts are data-allocation capacity. The `scheduled_*` counts are the exact
# deterministic Gatling action plan. The performance allocation retains 20% reserve capacity, but the
# workload receives only the exact scheduled rows, so it cannot over-consume or reuse data.
#
# The smoke profile is used by Jenkins proof validation. The validation profile is the first
# multi-user end-to-end run: ten users for five minutes at one completed action per user per
# minute, with 20% headroom. The performance profile is the 500-user 70-minute weighted run.

smoke.update_application=1
smoke.add_application=1
smoke.result_application=1
smoke.result_multiple=1
smoke.update_result=1
smoke.update_list=1
smoke.close_list=1
smoke.bulk_officials=1
smoke.bulk_fees=1
smoke.bulk_upload=1

# Small end-to-end deterministic workload validation (10 users x 5 actions).
validation.concurrent_users=10
validation.duration_minutes=5
validation.actions_per_user=5
# Authenticate at the common controlled rate of one account every 1.5 seconds.
validation.login_ramp_up_seconds=15
validation.update_application=20
validation.add_application=9
validation.result_application=2
validation.result_multiple=4
validation.update_result=4
validation.update_list=3
validation.close_list=1
validation.bulk_officials=2
validation.bulk_fees=1
validation.bulk_upload=1
validation.scheduled_update_application=20
validation.scheduled_add_application=9
validation.scheduled_result_application=2
validation.scheduled_result_multiple=4
validation.scheduled_update_result=4
validation.scheduled_create_list=4
validation.scheduled_update_list=3
validation.scheduled_close_list=0
validation.scheduled_bulk_officials=2
validation.scheduled_bulk_fees=1
validation.scheduled_bulk_upload=0
validation.scheduled_other_operations=1

# Performance workload: 500 users x 70 actions = 35,000 scheduled actions. The rate is limited to
# one complete login every 1.5 seconds following the authentication failure investigation. This
# leaves sufficient time within the configured 120-minute Jenkins stage timeout for setup and reporting.
# The schedule uses the agreed weights with largest-remainder rounding. Allocation counts retain
# 20% reserve capacity.
performance.concurrent_users=500
performance.duration_minutes=70
performance.actions_per_user=70
# 500 accounts at the in-process authentication stage's one-login-every-1.5-seconds rate.
performance.login_ramp_up_seconds=750
performance.update_application=16515
performance.add_application=7758
performance.result_application=1869
performance.result_multiple=3256
performance.update_result=3058
performance.update_list=2537
performance.close_list=282
performance.bulk_officials=1768
performance.bulk_fees=580
performance.bulk_upload=281
performance.scheduled_update_application=13762
performance.scheduled_add_application=6465
performance.scheduled_result_application=1557
performance.scheduled_result_multiple=2713
performance.scheduled_update_result=2548
performance.scheduled_create_list=2517
performance.scheduled_update_list=2114
performance.scheduled_close_list=235
performance.scheduled_bulk_officials=1473
performance.scheduled_bulk_fees=483
performance.scheduled_bulk_upload=234
performance.scheduled_other_operations=899
