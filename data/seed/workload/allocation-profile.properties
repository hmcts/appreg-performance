# ARCPOC-1633 workload allocation profiles.
#
# The base action counts are data-allocation capacity. The `scheduled_*` counts are the exact
# deterministic Gatling action plan. The initial allocation retains 20% reserve capacity, but the
# workload receives only the exact scheduled rows, so it cannot over-consume or reuse data.
#
# The smoke profile is used by Jenkins proof validation. The validation profile is the first
# multi-user end-to-end run: ten users for five minutes at one completed action per user per
# minute, with 20% headroom. The initial profile is the 500-user 75-minute benchmark.

# Read-only initial-workload gate. It tests all 500 complete SSO/session paths at a conservative
# one login per second before the destructive 75-minute profile is attempted.
login_preflight.concurrent_users=500
login_preflight.login_ramp_up_seconds=500

smoke.update_application=1
smoke.add_application=1
smoke.result_application=1
smoke.result_multiple=1
smoke.update_result=1
smoke.update_list=1
smoke.close_list=1
smoke.bulk_officials=1
smoke.bulk_fees=1
smoke.bulk_upload=1

# Small end-to-end deterministic workload validation (10 users x 5 actions).
validation.concurrent_users=10
validation.duration_minutes=5
validation.actions_per_user=5
# Ten accounts over one second is within the confirmed safe 10-logins-per-second rate.
validation.login_ramp_up_seconds=1
validation.update_application=20
validation.add_application=9
validation.result_application=2
validation.result_multiple=4
validation.update_result=4
validation.update_list=3
validation.close_list=1
validation.bulk_officials=2
validation.bulk_fees=1
validation.bulk_upload=1
validation.scheduled_update_application=20
validation.scheduled_add_application=9
validation.scheduled_result_application=2
validation.scheduled_result_multiple=4
validation.scheduled_update_result=4
validation.scheduled_create_list=4
validation.scheduled_update_list=3
validation.scheduled_close_list=0
validation.scheduled_bulk_officials=2
validation.scheduled_bulk_fees=1
validation.scheduled_bulk_upload=0
validation.scheduled_other_operations=1

# Initial benchmark: 500 users x 75 actions = 37,500 scheduled actions. The schedule uses the
# agreed weights with largest-remainder rounding. Allocation counts retain 20% reserve capacity.
initial.concurrent_users=500
initial.duration_minutes=75
initial.actions_per_user=75
# 500 accounts / 10 safe logins per second.
initial.login_ramp_up_seconds=50
